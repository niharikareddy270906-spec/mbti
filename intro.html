<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBTI</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(-45deg, #d63745, #90632d, #6b8dd6, #72d737);
        background-size: 400% 400%;
        animation: gradientBG 10s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        padding: 50px;
        border-radius: 18px;
        width: 90%;
        max-width: 520px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        animation: fadeUp 1.2s ease;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 36px;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    p {
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 35px;
        opacity: 0.9;
    }

    .start-btn {
        padding: 14px 40px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background: linear-gradient(135deg, #ffffff, #e0d7ff);
        color: #5a2ea6;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    .start-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 35px rgba(255, 255, 255, 0.549);
    }

    .footer-text {
        margin-top: 25px;
        font-size: 13px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Know your Personality</h1>
    <p>
        Discover who you truly are.  
        Answer a few simple questions and unveil
        your personality traits in seconds.
    </p>

    <button class="start-btn" onclick="startTest()">start the quiz</button>

    <div class="footer-text">
        
    </div>
</div>

<script>
    function startTest() {
        window.location.href = "test.html";
    }
</script>

</body>
</html>
